name: Python and MuJoCo regression tests
on:
  push:
  pull_request:
jobs:
  simulation-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install MuJoCo runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglfw3 libosmesa6
      - name: Install python requirements
        run: python -m pip install -r requirements.txt
      - name: Run unit and model physics tests
        run: python -m pytest -q -rs
      - name: Run supported-body physics trial
        run: |
          PYTHONPATH="src/humanoid_kinematics:src/humanoid_motion_controller:src/humanoid_gait_planner:src/humanoid_benchmarks" \
          python -m humanoid_benchmarks.sim_validation --out results/local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supported-physics-trial
          path: results/local/*
          if-no-files-found: ignore
